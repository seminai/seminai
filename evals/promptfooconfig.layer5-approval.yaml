# Layer 5 — Approval Flow Evaluation
# Tests whether the agent correctly communicates about approval requirements,
# shows previews before destructive operations, and delegates appropriately.

description: "Dosage ReAct Agent — Approval Flow Eval (Layer 5)"

prompts:
  - "{{input_prompt}}"

providers:
  - id: file://./providers/system-prompt.provider.ts
    label: "GPT-4o + Approval Flow"
    config:
      model: gpt-4o
      temperature: 0

  - id: file://./providers/system-prompt.provider.ts
    label: "GPT-4o-mini + Approval Flow"
    config:
      model: gpt-4o-mini
      temperature: 0

defaultTest:
  options:
    provider: openrouter:openai/gpt-4o-mini
  assert:
    # Every response must be in Italian
    - type: llm-rubric
      value: "The response is written in Italian language."
    - type: javascript
      value: "output.length > 50"

tests: file://./datasets/approval-flow.yaml
