# Layer 2 — Crop Matcher: tests the LLM crop-to-product matching prompt.
# Validates that the LLM correctly determines product-crop compatibility.

- description: "Match diretto — Vite su Vite"
  vars:
    productName: "Rame Caffaro Blu"
    categoria: "Fungicida"
    principioAttivo: "Ossicloruro di rame"
    crops: "Vite, Melo, Pero, Pesco, Olivo"
    targetCrop: "Vite"
    targetVariety: "N/A"
    targetCommonName: "Vite"
    targetCategory: "Arboree da frutto"
    targetFamily: "Vitaceae"
    targetSpecies: "Vitis vinifera"
    targetGenus: "Vitis"
    targetClass: "Magnoliopsida"
    targetOrder: "Vitales"
  assert:
    - type: is-json
    - type: javascript
      value: "JSON.parse(output).isCompatible === true"
    - type: javascript
      value: "JSON.parse(output).confidence >= 90"

