# Layer 2 — Date Planner: tests the LLM phenological date estimation prompt.
# Validates that the LLM returns chronologically correct and agronomically plausible dates.

- description: "Cereale autunno-vernino — Frumento tenero, Emilia-Romagna"
  vars:
    cropName: "Frumento tenero"
    variety: ""
    location: "Emilia-Romagna"
    year: "2025"
    prevYear: "2024"
  assert:
    - type: is-json
    - type: javascript
      value: >
        const d = JSON.parse(output);
        d.startDate.startsWith('2024') && d.harvestingDate.startsWith('2025')
    - type: javascript
      value: >
        const d = JSON.parse(output);
        new Date(d.startDate) < new Date(d.floweringDate) &&
        new Date(d.floweringDate) < new Date(d.harvestingDate)
    - type: javascript
      value: >
        const d = JSON.parse(output);
        const startMonth = new Date(d.startDate).getMonth();
        startMonth >= 8 && startMonth <= 11

