- description: "Coltura perenne — Vite, Toscana"
  vars:
    cropName: "Vite"
    variety: "Sangiovese"
    location: "Toscana"
    year: "2025"
    prevYear: "2024"
  assert:
    - type: is-json
    - type: javascript
      value: >
        const d = JSON.parse(output);
        d.startDate.startsWith('2025')
    - type: javascript
      value: >
        const d = JSON.parse(output);
        new Date(d.startDate) < new Date(d.floweringDate) &&
        new Date(d.floweringDate) < new Date(d.harvestingDate)
    - type: javascript
      value: >
        const d = JSON.parse(output);
        const startMonth = new Date(d.startDate).getMonth();
        startMonth >= 1 && startMonth <= 3
    - type: javascript
      value: >
        const d = JSON.parse(output);
        const harvestMonth = new Date(d.harvestingDate).getMonth();
        harvestMonth >= 7 && harvestMonth <= 10

