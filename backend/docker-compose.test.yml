version: '3.9'

services:
  postgres:
    image: postgres:15.5-alpine
    platform: linux/arm64
    ports:
      - '${SEMINAI_TEST_DB_PORT:-55432}:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seminai_test
    volumes:
      - seminai_test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d seminai_test']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    ports:
      - '${SEMINAI_TEST_REDIS_PORT:-56379}:6379'
    command: redis-server --appendonly no --save ""
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  seminai_test_postgres_data:
