version: '1.0'
services:
  app:
    build:
      context: .
    ports:
      - '8081:8081'
    env_file:
      - ./.env
    environment:
      # Local-only development credential; never used outside this Compose network.
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/auth-boiler-plate?schema=public # trufflehog:ignore
      - JWT_SECRET=change-this-secret-in-production
      - JWT_EXPIRES_IN="1d"
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - FRONTEND_URL=http://localhost:8081
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
    volumes:
      # Mount only source files for hot reload in development
      - ./src:/usr/src/app/src:ro
      - ./prisma:/usr/src/app/prisma:ro
      - ./data:/usr/src/app/data
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
      redis:
        condition: service_started
    command: >
      sh -c "bunx prisma migrate deploy &&
             bun ./dist/infrastructure/http/server.js"

  postgres:
    image: postgres:15.5-alpine
    platform: linux/arm64
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=auth-boiler-plate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: jcalonso/mailhog:v1.0.1
    platform: linux/arm64
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web interface

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.16.1
    platform: linux/arm64
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:6333/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    platform: linux/arm64
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: seminai_local
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  mongodb_data:
