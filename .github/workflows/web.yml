name: web-docker
on:
  workflow_dispatch:
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'compose.yaml', 'scripts/deploy/**', 'backend/**', 'frontend/**', 'package*.json', '.github/workflows/web.yml']
permissions:
  contents: read
concurrency:
  group: web-docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker build -t seminai:web-candidate .
      - run: node scripts/deploy/web-smoke.mjs
