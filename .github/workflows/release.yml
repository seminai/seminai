name: release-assets

# Builds SBOM and multi-arch images. Does not publish GitHub releases or tags.
on:
  workflow_dispatch:

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: npm ci
      - run: npm run sbom
      - run: docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile -t seminai:ci .
      - run: echo "No GitHub release, tag push, or visibility change is performed."
