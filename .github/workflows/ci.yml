name: ci

on:
  push:
    branches: [main, feat/local-first-monorepo]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: backend-unit (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: seminai
          POSTGRES_PASSWORD: seminai
          POSTGRES_DB: seminai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U seminai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NODE_ENV: test
      LLM_GATEWAY: ollama
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      CLAUDE_API_KEY: ''
      DATABASE_URL: postgresql://seminai:seminai@127.0.0.1:5432/seminai?schema=public&sslmode=disable
      DIRECT_URL: postgresql://seminai:seminai@127.0.0.1:5432/seminai?schema=public&sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379
      TEST_DATABASE_URL: postgresql://seminai:seminai@127.0.0.1:5432/seminai?schema=public&sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379
      SEMINAI_TEST_DB_PORT: '5432'
      SEMINAI_TEST_REDIS_PORT: '6379'
      SEMINAI_TEST_EXTERNAL_SERVICES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace @seminai/backend
      - run: npm run test:unit --workspace @seminai/backend -- --shard=${{ matrix.shard }}/4
  check:
    name: lint-test-privacy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: seminai
          POSTGRES_PASSWORD: seminai
          POSTGRES_DB: seminai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U seminai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NODE_ENV: test
      LLM_GATEWAY: ollama
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      CLAUDE_API_KEY: ''
      DATABASE_URL: postgresql://seminai:seminai@127.0.0.1:5432/seminai?schema=public&sslmode=disable
      DIRECT_URL: postgresql://seminai:seminai@127.0.0.1:5432/seminai?schema=public&sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Use the native GitHub service containers for integration tests
        run: |
          echo "TEST_DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "TEST_REDIS_URL=$REDIS_URL" >> "$GITHUB_ENV"
          echo "SEMINAI_TEST_DB_PORT=5432" >> "$GITHUB_ENV"
          echo "SEMINAI_TEST_REDIS_PORT=6379" >> "$GITHUB_ENV"
          echo "SEMINAI_TEST_EXTERNAL_SERVICES=true" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run codegen
      - run: npm run build
      - run: npm run type-check
      - run: npm run lint
      - run: npm run lint:structure
      - run: python3 -B -m unittest discover -s scripts/release -p 'test_*.py'
      - run: npm run test --workspace @seminai/frontend
      - run: npm run test:unit --workspace @seminai/mcp-connector
      - run: npm run openapi:drift
      - run: npm run privacy:scan:full
      # PUBLIC includes every FAST test; run the superset once against native services.
      - run: npm run test:integration:public -- --silent --detectOpenHandles
