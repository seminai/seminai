name: desktop-installers
on:
  workflow_dispatch:
  pull_request:
    paths:
      [
        'backend/**',
        'frontend/**',
        'packages/**',
        'package*.json',
        'scripts/**',
        '.github/workflows/desktop.yml',
      ]
  push:
    tags: ['v1.0.1-rc.*', 'v1.0.1']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, target: win, arch: x64 }
          - { os: macos-15-intel, target: mac, arch: x64 }
          - { os: macos-15, target: mac, arch: arm64 }
          - { os: ubuntu-22.04, target: linux, arch: x64 }
          - { os: ubuntu-22.04-arm, target: linux, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
      DESKTOP_TARGET: ${{ matrix.target }}
      CSC_LINK: ${{ github.ref == 'refs/tags/v1.0.1' && (matrix.target == 'win' && secrets.WINDOWS_CSC_LINK || matrix.target == 'mac' && secrets.MAC_CSC_LINK) || '' }}
      CSC_KEY_PASSWORD: ${{ github.ref == 'refs/tags/v1.0.1' && (matrix.target == 'win' && secrets.WINDOWS_CSC_KEY_PASSWORD || matrix.target == 'mac' && secrets.MAC_CSC_KEY_PASSWORD) || '' }}
      APPLE_ID: ${{ github.ref == 'refs/tags/v1.0.1' && matrix.target == 'mac' && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ github.ref == 'refs/tags/v1.0.1' && matrix.target == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ github.ref == 'refs/tags/v1.0.1' && matrix.target == 'mac' && secrets.APPLE_TEAM_ID || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.23.1', cache: npm }
      - run: node scripts/release/check-desktop-signing.mjs
      - run: npm ci
      - run: npm run codegen
      - run: npm run build --workspace @seminai/backend
      - run: npm run build --workspace @seminai/frontend
      - run: npm run build --workspace @seminai/mcp-connector
      - run: npm run test --workspace @seminai/desktop
      - run: node --test scripts/release/desktop-sbom.test.mjs
      - run: npm run test:desktop --workspace @seminai/backend
      - name: Test backup restore and abrupt supervisor termination
        run: node packages/desktop/scripts/recovery-check.cjs
      - run: npm run package:mcpb --workspace @seminai/mcp-connector
      - run: npm run fetch:tunnel --workspace @seminai/desktop
      - run: npm run stage --workspace @seminai/desktop
      - name: Test bundled runtime without system services
        run: node packages/desktop/scripts/smoke-isolated.mjs
      - run: npm exec --workspace @seminai/desktop -- electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Test packaged Node, services and database persistence
        run: node packages/desktop/scripts/smoke-packaged.mjs
      - name: Install artifact and verify services, persistence and recovery
        run: node packages/desktop/scripts/install-check.mjs
      - run: node scripts/release/desktop-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: seminai-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/SHA256SUMS.txt
            packages/desktop/release/SBOM.cdx.json
            packages/desktop/release/LICENSES.txt
            packages/mcp/seminai-mcp-1.0.1.mcpb
