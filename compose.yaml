name: seminai

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: seminai:local
    ports:
      - '8081:8081'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: production
      APP_MODE: all
      PORT: '8081'
      HOST: 0.0.0.0
      DATA_DIR: /data
      SPA_DIR: /app/spa
      DATABASE_URL: postgresql://seminai:seminai@postgres:5432/seminai?schema=public&sslmode=disable
      DIRECT_URL: postgresql://seminai:seminai@postgres:5432/seminai?schema=public&sslmode=disable
      REDIS_URL: redis://redis:6379
      ACCESS_MODE: lan
      PUBLIC_BASE_URL: http://localhost:8081
      BACKEND_URL: http://localhost:8081
      LLM_GATEWAY: ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./data/app:/data
    command:
      [
        'sh',
        '-c',
        'npx prisma migrate deploy && node --import tsx --import ./prisma-alias-register.mjs dist/infrastructure/runtime/main.js',
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: seminai
      POSTGRES_PASSWORD: seminai
      POSTGRES_DB: seminai
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seminai']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-bookworm
    command: redis-server --appendonly yes --dir /data
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ./data/ollama:/root/.ollama

  qdrant:
    profiles: [qdrant]
    image: qdrant/qdrant:v1.16.1
    ports:
      - '6333:6333'
    volumes:
      - ./data/qdrant:/qdrant/storage

  mailpit:
    profiles: [mailpit]
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  tailscale:
    profiles: [tailscale]
    image: tailscale/tailscale:latest
    hostname: seminai
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: 'true'
    volumes:
      - ./data/tailscale:/var/lib/tailscale
    cap_add:
      - NET_ADMIN

  cloudflared:
    profiles: [cloudflare]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
